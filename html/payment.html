<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EFIGHT - Paiement </title>
  <link rel="stylesheet" href="../css/style.css" />
  <script src="../js/script.js"></script>
</head>
<body>
<header class="site-header">
  <div class="container nav-container">
    <a href="index.html" class="logo">EFIGHT</a>
    <nav class="main-nav" id="mainNav">
      <a href="index.html">Accueil</a>
      <a href="events.html">Events</a>
      <a href="contact.html">Contact</a>
      <a href="about.html">About</a>
    </nav>
  </div>
</header>

<main class="section">
  <div class="container narrow-container">
    <h1>Paiement sécurisé</h1>

    <div class="form-box">
      <div id="paymentSummary" style="margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid var(--border);">
      </div>

      <form id="paymentForm" novalidate>
        <div id="paymentErrors" class="form-errors"></div>

        <div class="form-group">
          <label for="cardName">Nom sur la carte</label>
          <input type="text" id="cardName" placeholder="M. JEAN DUPONT" required />
        </div>

        <div class="form-group">
          <label for="cardNumber">Numéro de carte</label>
          <input type="text" id="cardNumber" placeholder="1234 5678 1234 5678" maxlength="19" required />
        </div>

        <div class="form-row-2">
          <div class="form-group">
            <label for="expDate">Date d'expiration</label>
            <input type="text" id="expDate" placeholder="MM/AA" maxlength="5" required />
          </div>
          <div class="form-group">
            <label for="cvv">CVV</label>
            <input type="text" id="cvv" placeholder="123" maxlength="3" required />
          </div>
        </div>

        <button type="submit" class="btn btn-primary" style="width: 100%;">Confirmer le paiement</button>
      </form>
    </div>
  </div>
</main>
</body>
</html>
